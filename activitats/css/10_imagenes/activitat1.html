<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="activitat1.css">
</head>
<body>
      <section class="chat" aria-label="Chat entre dos personas">
    <article class="message">
      <img class="avatar" src="https://i.pravatar.cc/80?img=32" alt="Avatar de Jessi">
      <div class="bubble">
        <header class="header">
          <span class="name">Jessi</span>
          <time datetime="2026-02-11T15:58">11/02/2026 · 15:58</time>
        </header>
        <p class="text">
          ¡Hola, Javi! ¿Como llevas el trabajo?
        </p>
      </div>
    </article>
    <article class="message me">
      <div class="bubble">
        <header class="header">
          <span class="name">Javi</span>
          <time datetime="2026-02-11T16:00">11/02/2026 · 16:00</time>
        </header>
        <p class="text">
          Casi lo tengo hecho. 
        </p>
      </div>
      <img class="avatar" src="https://i.pravatar.cc/80?img=12" alt="Avatar de Javi">
    </article>
  </section>
  <template id="tpl-message">
    <article class="message">
      <img class="avatar" src="" alt="">
      <div class="bubble">
        <header class="header">
          <span class="name"></span>
          <time></time>
        </header>
        <p class="text"></p>
      </div>
    </article>
  </template>
</body>
</html>
