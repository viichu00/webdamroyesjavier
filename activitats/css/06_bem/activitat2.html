<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="activitat2.css">
</head>
<body>
    <section class="comments">
        <h2>Comentarios</h2>
        <form class="comments_form">
            <input class="input" type="text" placeholder="Tu nombre"> <br>
            <textarea class="textarea" placeholder="Escribe tu comentario"></textarea> <br>
            <button>Enviar</button>
        </form>
        <div class="list">
            <div class="comment">
                <p class="author">Rodrigo</p>
                <p class="text">Bastante útil, la verdad.</p>
            </div>
            <div class="comment">
                <p class="author">Mari Carmen</p>
                <p class="text">No me ha servido de nada... Descontenta.</p>
            </div>
            <div class="comment">
                <p class="author">Maria José</p>
                <p class="text">¡SIN PALABRAS!</p>
            </div>
        </div>
    </section>
</body>
</html>
