<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registro de usuario</h2>
    <form>
        <fieldset>
            <legend>Datos personales</legend>
            <label for="Nombre"> Nombre
                <input type="text" id="nombre" name="nombre" required>
            </label>
            <br><br>
            <label for="Apellidos"> Apellidos
                <input type="text" id="Apellidos" name="Apellidos" required>
            </label>
            <br><br>
            <label for="Fecha de nacimiento"> Fecha de nacimiento
                <input type="date" id="Fecha de nacimiento" name="Fecha de nacimiento" required>
            </label>
            <br><br>
            <label for="Género"> Género
                <select name="Género"> Género
                    <option value="0"></option>
                    <option value="1">Masculino</option>
                    <option value="2">Femenino</option>
                    <option value="3">Otro</option>
                </select>
            </label>
        </fieldset>
        <br>
        <fieldset>
            <legend>Datos de la cuenta</legend>
            <label for="Nombre de usuario"> Nombre de usuario
                <input type="text" id="username" name="username" required>
            </label>
            <br><br>
            <label for="Correo eléctronico"> Correo eléctronico 
                <input type="email" id="email" name="email" required>
            </label>
            <br><br>
            <label for="Contraseña"> Contraseña 
                <input type="password" id="password" name="password" minlength="8" required>
            </label>
            <br><br>
            <label for="Confirmar contraseña"> Confirmar contraseña 
                <input type="password" id="password2" name="password2" minlength="8" required>
            </label>
        </fieldset>
        <input type="submit" value="Registrarse">
        <input type="reset" value="Limpiar">
    </form>
</body>
</html>
